<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Atlas distributed network</title><desc id="description">Four connected data towers on a blue perspective grid.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".65" stop-color="#071d4b"/><stop offset="1" stop-color="#041127"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#176ff2" stop-opacity=".6"/><stop offset="1" stop-color="#176ff2" stop-opacity="0"/></radialGradient>
    <pattern id="rack" width="220" height="67" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="195" height="31" rx="6" fill="#0c2858" stroke="#318cf3"/><rect x="22" y="19" width="112" height="9" rx="4" fill="#3199ff"/><circle cx="180" cy="23" r="6" fill="#3ce2d3"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><ellipse cx="1220" cy="210" rx="430" ry="370" fill="url(#glow)"/>
  <g fill="none" stroke="#2588ff" stroke-opacity=".58" stroke-width="2">
    <path d="M0 430H1600M0 475H1600M0 520H1600M0 565H1600M0 610H1600M0 655H1600M0 700H1600M0 745H1600M0 790H1600M0 850H1600M0 930H1600"/>
    <path d="M800 420L0 1000M800 420L230 1000M800 420L460 1000M800 420L690 1000M800 420L920 1000M800 420L1150 1000M800 420L1380 1000M800 420L1600 1000"/>
  </g>
  <g fill="#091a3d" stroke="#3c9bff" stroke-width="2"><rect x="180" y="270" width="250" height="490" rx="20"/><rect x="510" y="160" width="300" height="600" rx="20"/><rect x="890" y="250" width="240" height="510" rx="20"/><rect x="1180" y="110" width="255" height="650" rx="20"/></g>
  <g fill="url(#rack)"><rect x="194" y="310" width="222" height="430"/><rect x="549" y="200" width="222" height="530"/><rect x="899" y="290" width="222" height="440"/><rect x="1196" y="150" width="222" height="580"/></g>
</svg>
